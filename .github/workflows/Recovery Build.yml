name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Romeo13card-sys/device_xiaomi_fog-TWRP'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'ofox'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/fog'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'fog'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_fog'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
 
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'
    
    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        mka recoveryimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Find, rename and prepare files for upload
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        
        echo "=== Looking for the generated files ==="
        
        # 1. Ищем и переименовываем recovery.img (он часто лежит в корне)
        if [ -f "recovery.img" ]; then
          echo "✅ Found recovery.img in root folder"
          cp recovery.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-recovery.img
        else
          echo "⚠️ recovery.img not in root. Searching deeper..."
          if [ -f "recovery/recovery.img" ]; then
            cp recovery/recovery.img OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-recovery.img
            echo "✅ Found in recovery/ subfolder"
          fi
        fi

        # 2. Ищем OrangeFox.zip (он может называться по-разному)
        ZIP_FILE=$(find . -maxdepth 1 -name "OrangeFox*.zip" -o -name "*${{ github.event.inputs.DEVICE_NAME }}*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "✅ Found zip file: $ZIP_FILE"
          cp $ZIP_FILE OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-release.zip
        else
          echo "⚠️ Zip not found in root. Searching in obj/ or other subfolders..."
          ZIP_FILE=$(find . -name "OrangeFox*.zip" -o -name "*${{ github.event.inputs.DEVICE_NAME }}*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Found zip file in subfolder: $ZIP_FILE"
            cp $ZIP_FILE OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-release.zip
          else
            echo "❌ No zip file found anywhere. Please check the build logs."
          fi
        fi

        echo "=== Final files in ${{ github.event.inputs.DEVICE_NAME }} folder ==="
        ls -al
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-recovery.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-release.zip
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
